[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API requests use the function's custom /api/* route.
# Only frontend page URLs fall back to the React application.
[[redirects]]
  from = "/calendar"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/movie/*"
  to = "/index.html"
  status = 200
