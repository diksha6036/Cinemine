[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.site]
  included_files = ["dist/index.html", "dist-ssr/**"]

# The site function renders HTML at /*, excluding API and static-asset routes.
# The movie-api function keeps the existing /api/* routes.
